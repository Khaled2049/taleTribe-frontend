name: PR Check

on:
  pull_request:
    branches: [main]

# A new push to the same PR makes the in-flight run obsolete.
concurrency:
  group: pr-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Build (type-check + bundle)
        run: yarn build
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder
          VITE_FIREBASE_MESSAGE_SENDER_ID: placeholder
          VITE_FIREBASE_APP_ID: placeholder
          VITE_FIREBASE_MEASUREMENT_ID: placeholder
          VITE_RPC_URL: placeholder
          VITE_USDC_TOKEN_ADDRESS: placeholder
          VITE_TIPPING_CONTRACT_ADDRESS: placeholder
          VITE_CHAIN_ID: "1"
          VITE_MAX_AI_USAGE: "100"
          VITE_APP_NAME: NovelSync

  functions:
    name: Functions Type-check & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Type-check
        working-directory: functions
        run: npm run build

      - name: Dependency audit
        working-directory: functions
        run: npm audit --audit-level=critical

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      # -backend=false keeps this credential-free, so it behaves the same on a
      # fork PR. The apply lives in deploy.yml, which authenticates via WIF.
      - name: Format & validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
