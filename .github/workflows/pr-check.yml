name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_call: {}

# A new push to the same PR makes the in-flight run obsolete.
concurrency:
  group: pr-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  frontend:
    name: taleTribe-frontend / build-test-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Assistant contract drift check
        run: yarn assistant:contracts:check

      - name: Test
        run: yarn test

      - name: Build (type-check + bundle)
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder
          VITE_FIREBASE_MESSAGE_SENDER_ID: placeholder
          VITE_FIREBASE_APP_ID: placeholder
          VITE_FIREBASE_MEASUREMENT_ID: placeholder
          VITE_RPC_URL: placeholder
          VITE_USDC_TOKEN_ADDRESS: placeholder
          VITE_TIPPING_CONTRACT_ADDRESS: placeholder
          VITE_CHAIN_ID: "1"
          VITE_MAX_AI_USAGE: "100"
          VITE_APP_NAME: TheTaleTribe
          VITE_STORY_DATA_URL: https://story-data.placeholder.invalid

        run: yarn build
  functions:
    name: taleTribe-frontend / functions-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Type-check
        working-directory: functions
        run: npm run build

      - name: Dependency audit
        working-directory: functions
        run: npm audit --audit-level=critical

  terraform:
    name: taleTribe-frontend / terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      # -backend=false keeps this credential-free, so it behaves the same on a
      # fork PR. The apply lives in deploy.yml, which authenticates via WIF.
      - name: Format & validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
  format:
    name: taleTribe-frontend / format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prettier --check "src/**/*.{ts,tsx,css,json}"
  lint:
    name: taleTribe-frontend / lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
