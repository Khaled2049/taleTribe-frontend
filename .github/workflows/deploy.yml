name: Deploy to Firebase Hosting & Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: story-6f89f
  REGION: us-central1
  FIREBASE_HOSTING_SITE: story-6f89f
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_url: ${{ steps.terraform.outputs.backend_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Sync secrets to GCP
        run: |
          sync_secret() {
            local name="$1"
            local value="$2"
            local current
            current=$(gcloud secrets versions access latest --secret="$name" --project=${{ env.PROJECT_ID }} 2>/dev/null) || current=""
            if [ "$current" != "$value" ]; then
              echo "Updating $name (value changed)"
              printf '%s' "$value" | gcloud secrets versions add "$name" --data-file=- --project=${{ env.PROJECT_ID }}
            else
              echo "Skipping $name (unchanged)"
            fi
          }
          sync_secret "SMTP_USER" "${{ secrets.SMTP_USER }}"
          sync_secret "SMTP_PASS" "${{ secrets.SMTP_PASS }}"
          sync_secret "EMAIL_FROM" "${{ secrets.EMAIL_FROM }}"
          sync_secret "MAGIC_LINK_REDIRECT_URL" "${{ secrets.MAGIC_LINK_REDIRECT_URL }}"
          sync_secret "REPLICATE_API_TOKEN" "${{ secrets.REPLICATE_API_TOKEN }}"
          sync_secret "ENCRYPTION_KEY" "${{ secrets.ENCRYPTION_KEY }}"
          sync_secret "BOOKS_API_KEY" "${{ secrets.BOOKS_API_KEY }}"

      - name: Destroy old secret versions
        run: |
          cleanup_secret() {
            local name="$1"
            local versions
            versions=$(gcloud secrets versions list "$name" --project=${{ env.PROJECT_ID }} \
              --filter="state=enabled" --format="value(name)" --sort-by="~createTime")
            local skip=true
            for v in $versions; do
              if $skip; then
                skip=false
                continue
              fi
              echo "Destroying $name version $v"
              gcloud secrets versions destroy "$v" --secret="$name" --project=${{ env.PROJECT_ID }} --quiet
            done
          }
          cleanup_secret "SMTP_USER"
          cleanup_secret "SMTP_PASS"
          cleanup_secret "EMAIL_FROM"
          cleanup_secret "MAGIC_LINK_REDIRECT_URL"
          cleanup_secret "REPLICATE_API_TOKEN"
          cleanup_secret "ENCRYPTION_KEY"
          cleanup_secret "BOOKS_API_KEY"

      - name: Get Backend URL
        id: terraform
        working-directory: ./terraform
        run: |
          BACKEND_URL=$(terraform output -raw backend_service_url)
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Require story-data URL
        env:
          VITE_STORY_DATA_URL: ${{ secrets.VITE_STORY_DATA_URL }}
        run: |
          if [ -z "$VITE_STORY_DATA_URL" ]; then
            echo "::error::VITE_STORY_DATA_URL is not set. The bundle would fall back to the relative path /story-data, which Hosting rewrites to index.html, so every API call would return HTML with a 200."
            exit 1
          fi

      - name: Build
        run: yarn build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGE_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}
          VITE_USDC_TOKEN_ADDRESS: ${{ secrets.VITE_USDC_TOKEN_ADDRESS }}
          VITE_TIPPING_CONTRACT_ADDRESS: ${{ secrets.VITE_TIPPING_CONTRACT_ADDRESS }}
          VITE_CHAIN_ID: ${{ secrets.VITE_CHAIN_ID }}
          VITE_MAX_AI_USAGE: ${{ secrets.VITE_MAX_AI_USAGE }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_AGENT_MCP_URL: ${{ secrets.VITE_AGENT_MCP_URL || 'https://novelsync-agents-ukvrbnaddq-uc.a.run.app' }}
          VITE_STORY_DATA_URL: ${{ secrets.VITE_STORY_DATA_URL }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          # Only has to survive the hand-off to the deploy job below. The default
          # is 90 days, which filled the account's artifact storage quota.
          retention-days: 1

  deploy:
    name: Deploy Firebase
    needs: [terraform-apply, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create functions .env
        env:
          AGENT_SERVICE_URL: ${{ needs.terraform-apply.outputs.backend_url }}
          STORY_DATA_URL: ${{ secrets.VITE_STORY_DATA_URL }}
        run: |
          {
            echo "AGENT_SERVICE_URL=$AGENT_SERVICE_URL"
            echo "STORY_DATA_URL=$STORY_DATA_URL"
          } > functions/.env

      - name: Update firebase-functions
        working-directory: ./functions
        run: npm install --save firebase-functions@latest

      - name: Deploy
        run: |
          firebase deploy \
            --only hosting,functions,firestore:rules,firestore:indexes,storage \
            --project=${{ env.PROJECT_ID }} \
            --force

      - name: Wait for deployment to stabilize
        run: sleep 10

      - name: Health check
        run: |
          FRONTEND_URL="https://${{ env.FIREBASE_HOSTING_SITE }}.web.app"
          echo "Checking frontend health: $FRONTEND_URL"
          curl -f -I "$FRONTEND_URL" || exit 1
          echo "Frontend is healthy!"

      - name: Deployment Summary
        run: |
          echo "## Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          echo "- **Hosting URL:** [https://${{ env.FIREBASE_HOSTING_SITE }}.web.app](https://${{ env.FIREBASE_HOSTING_SITE }}.web.app)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          echo "- **Service URL:** [${{ needs.terraform-apply.outputs.backend_url }}](${{ needs.terraform-apply.outputs.backend_url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
