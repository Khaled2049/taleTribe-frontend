<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>%VITE_APP_NAME% — Where Your Stories Live</title>
    <meta
      name="title"
      content="%VITE_APP_NAME% — Where Your Stories Live"
    />
    <meta
      name="description"
      content="TheTaleTribe is where writers write, publish, and build a presence around their work. Join a community of writers and readers who take independent storytelling seriously."
    />
    <meta
      name="keywords"
      content="indie authors, independent publishing, story writing platform, author community, writing community, novel writing, storytelling, indie fiction, book community"
    />
    <meta name="author" content="%VITE_APP_NAME% Team" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/book.svg" />
    <link rel="apple-touch-icon" href="/book.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_APP_NAME%" />
    <meta
      property="og:title"
      content="%VITE_APP_NAME% — Where Your Stories Live"
    />
    <meta
      property="og:description"
      content="TheTaleTribe is where writers write, publish, and build a presence around their work. Join a community of writers and readers who take independent storytelling seriously."
    />
    <meta property="og:url" content="https://thetaletribe.web.app/" />
    <meta property="og:image" content="https://thetaletribe.web.app/book.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="%VITE_APP_NAME% — Where Your Stories Live"
    />
    <meta
      name="twitter:description"
      content="TheTaleTribe is where writers write, publish, and build a presence around their work. Join a community of writers and readers who take independent storytelling seriously."
    />
    <meta name="twitter:image" content="https://thetaletribe.web.app/book.svg" />

    <!-- Theme -->
    <meta name="theme-color" content="#B91C1C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,400..500&family=Crimson+Pro:ital,wght@0,300..700;1,300..400&family=Hanken+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
